sonar.projectKey=oussemaissaoui_farmyapp
sonar.organization=oussemaissaoui

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Source folders to analyze
sonar.sources=lib
sonar.tests=test

# Exclude generated code, translations, and non-essential files from analysis
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/generated/**,lib/l10n/**,test/**,assets/**
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,lib/generated/**,lib/l10n/**,test/**

# Path to code coverage report
sonar.dart.lcov.reportPaths=coverage/lcov.info

