sonar.projectKey=oussemaissaoui_farmyapp
sonar.organization=oussemaissaoui

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Source folders to analyze
sonar.sources=lib
sonar.tests=test

# Exclude generated code and assets from coverage/analysis
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/generated/**
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,lib/generated/**,test/**

# Path to code coverage report
sonar.dart.lcov.reportPaths=coverage/lcov.info
